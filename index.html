<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>검토 설문 종료</title>
<style>
:root{--bg:#f7f7f5;--fg:#222;--sub:#666}
@media (prefers-color-scheme: dark){:root{--bg:#1c1c1c;--fg:#eee;--sub:#aaa}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
main{max-width:480px;text-align:center}
h1{font-size:1.3rem;margin:0 0 .6rem}
p{color:var(--sub);line-height:1.6;margin:0}
</style>
</head>
<body>
<main>
<h1>이 검토 설문은 닫혔습니다</h1>
<p>용어 검토는 문서로 따로 요청드릴 예정입니다.</p>
</main>
</body>
</html>
